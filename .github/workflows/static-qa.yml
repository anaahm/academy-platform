name: Static QA

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Lint Hostinger PHP API
        run: |
          php -l api/bootstrap.php
          php -l api/index.php
          php -l api/config.example.php
      - name: Run syntax, validation and DOM regression tests
        run: npm test
      - name: Build Hostinger upload ZIP
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p deploy
          cp -a *.html manifest.webmanifest offline.html sw.js deploy/
          cp -a assets api hostinger deploy/
          rm -f deploy/api/config.local.php
          (cd deploy && zip -r ../academy-hostinger-upload.zip . -x '*/.DS_Store')
      - name: Upload Hostinger package
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: academy-hostinger-upload
          path: academy-hostinger-upload.zip
          retention-days: 14
          if-no-files-found: error

