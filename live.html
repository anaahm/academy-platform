<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>البث المباشر | الأكاديمية</title>
  <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/app-icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="./assets/styles.css"><link rel="stylesheet" href="./assets/learning.css"><link rel="stylesheet" href="./assets/hub.css">
  <link rel="stylesheet" href="./assets/ui-kit.css">
  <link rel="stylesheet" href="./assets/experience.css?v=30">
  <script src="./assets/academy-utils.js"></script>
</head>
<body class="feature-page">
  <div id="toast" class="toast"></div>
  <header class="learning-header">
    <div class="container learning-nav">
      <a class="brand" href="./index.html"><span class="brand-mark"><i class="fa-solid fa-book-open"></i></span><span><strong>الأكاديمية</strong><small>البث المباشر</small></span></a>
      <div class="learning-breadcrumb"><a href="./index.html">الرئيسية</a><i class="fa-solid fa-chevron-left"></i><span>البث المباشر</span></div>
      <span class="avatar" id="pageAvatar">ط</span>
    </div>
  </header>

  <main>
    <section class="feature-hero">
      <div class="container">
        <div class="feature-hero-card">
          <div class="feature-hero-copy"><span class="section-kicker light">تعلم مع المدرس لحظة بلحظة</span><h1>الجلسات والبث المباشر</h1><p>تابع الدروس المباشرة، اعرف موعد الجلسة القادمة، وادخل YouTube أو Zoom من مكان واحد.</p></div>
          <span class="feature-hero-art">🔴</span>
        </div>
      </div>
    </section>

    <section class="container feature-container">
      <div class="feature-toolbar">
        <div class="feature-tabs" role="tablist" aria-label="حالة الجلسات">
          <button class="active" data-live-filter="live" role="tab" aria-selected="true">مباشر الآن</button>
          <button data-live-filter="upcoming" role="tab" aria-selected="false">القادمة</button>
          <button data-live-filter="ended" role="tab" aria-selected="false">المنتهية</button>
          <button data-live-filter="all" role="tab" aria-selected="false">الكل</button>
        </div>
        <div class="feature-filter"><input id="liveSearch" type="search" aria-label="البحث في الجلسات" placeholder="ابحث باسم الجلسة أو المدرس..."></div>
      </div>

      <div class="feature-stat-row">
        <article><span class="stat-icon red"><i class="fa-solid fa-tower-broadcast"></i></span><div><strong id="liveNowCount">0</strong><small>مباشر الآن</small></div></article>
        <article><span class="stat-icon blue"><i class="fa-solid fa-calendar"></i></span><div><strong id="upcomingCount">0</strong><small>جلسات قادمة</small></div></article>
        <article><span class="stat-icon green"><i class="fa-solid fa-circle-check"></i></span><div><strong id="endedCount">0</strong><small>جلسات منتهية</small></div></article>
        <article><span class="stat-icon violet"><i class="fa-solid fa-clock"></i></span><div><strong id="nextSessionText">—</strong><small>أقرب موعد</small></div></article>
      </div>

      <div class="live-grid" id="liveGrid"></div>
    </section>
  </main>

  <div class="live-viewer hidden" id="liveViewer" aria-hidden="true">
    <div class="live-viewer-panel" role="dialog" aria-modal="true" aria-labelledby="liveViewerTitle" tabindex="-1">
      <div class="live-viewer-head"><div><span class="section-kicker">مشاهدة الجلسة</span><h3 id="liveViewerTitle">الجلسة</h3></div><button class="modal-close static" id="closeLiveViewer" aria-label="إغلاق نافذة الجلسة"><i class="fa-solid fa-xmark"></i></button></div>
      <div class="live-video" id="liveVideo"></div>
      <div class="live-viewer-actions-row" id="liveViewerActions"></div>
    </div>
  </div>

  <script src="./assets/ui-kit.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="./assets/firebase-config.js"></script><script src="./assets/student-core.js"></script><script src="./assets/pro-features.js"></script><script src="./assets/live.js"></script><script src="./assets/activity-tracker.js"></script>
  <script src="./assets/pwa.js"></script>
  <script src="./assets/student-shell.js"></script>
</body>
</html>
