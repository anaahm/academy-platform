<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>جاري تحميل لوحة الإدارة...</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a;display:flex;min-height:100vh;align-items:center;justify-content:center}.loader{text-align:center;padding:32px}.spinner{width:46px;height:46px;border:5px solid #e2e8f0;border-top-color:#0f172a;border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}h2{margin:0 0 8px;font-size:20px}p{margin:0;color:#64748b;font-size:14px}.error{max-width:620px;background:#fff;border:1px solid #fecaca;border-radius:20px;padding:24px;box-shadow:0 14px 35px rgba(15,23,42,.08)}
  </style>
</head>
<body>
  <div class="loader"><div class="spinner"></div><h2>جاري تحميل لوحة الإدارة...</h2><p>يتم تشغيل الواجهة المطورة مع جميع وظائف الإدارة الأصلية.</p></div>
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <script>
    (async function(){
      try{
        const parts=['legacy/admin16.1.part','legacy/admin16.2.part','legacy/admin16.3.part'];
        const values=await Promise.all(parts.map(async path=>{
          const response=await fetch(path+'?v=2',{cache:'no-store'});
          if(!response.ok) throw new Error('تعذر تحميل '+path);
          return (await response.text()).trim();
        }));
        const b64=values.join('');
        const binary=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
        let html=pako.ungzip(binary,{to:'string'});
        html=html.replace('</head>','<link rel="stylesheet" href="assets/css/admin-modern.css?v=3"></head>');
        html=html.replace('</body>','<script src="assets/js/admin-ui.js?v=3"><\/script></body>');
        document.open();document.write(html);document.close();
      }catch(error){console.error(error);document.body.innerHTML='<div class="error"><h2>تعذر تشغيل لوحة الإدارة</h2><p>جرّب تحديث الصفحة بعد لحظات.</p></div>'}
    })();
  </script>
</body>
</html>
