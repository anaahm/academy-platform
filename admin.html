<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>جاري تحميل لوحة الإدارة...</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a;display:flex;min-height:100vh;align-items:center;justify-content:center}.loader{text-align:center;padding:32px}.spinner{width:46px;height:46px;border:5px solid #e2e8f0;border-top-color:#0f172a;border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}h2{margin:0 0 8px;font-size:20px}p{margin:0;color:#64748b;font-size:14px}.error{max-width:620px;background:#fff;border:1px solid #fecaca;border-radius:20px;padding:24px;box-shadow:0 14px 35px rgba(15,23,42,.08)}
  </style>
</head>
<body>
  <div class="loader"><div class="spinner"></div><h2>جاري تحميل لوحة الإدارة...</h2><p>يتم تشغيل الواجهة المطورة مع جميع وظائف الإدارة الأصلية.</p></div>
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <script>
    (async function(){
      try{
        const parts=['legacy/admin16.1.part','legacy/admin16.2.part','legacy/admin16.3.part'];
        const values=await Promise.all(parts.map(async path=>{
          const response=await fetch(path+'?v=2',{cache:'no-store'});
          if(!response.ok) throw new Error('تعذر تحميل '+path);
          return (await response.text()).trim();
        }));
        const b64=values.join('');
        const binary=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
        let html=pako.ungzip(binary,{to:'string'});
        const initStart=html.indexOf('init: () => {');
        const toggleStart=html.indexOf('toggleSidebar:',initStart);
        if(initStart>-1&&toggleStart>initStart){
          const secureInit=`init: () => {
                firebase.auth().onAuthStateChanged(async user => {
                    if(!user) {
                        document.getElementById('login-view').classList.remove('hidden');
                        document.getElementById('panel-view').classList.add('hidden');
                        return;
                    }
                    try {
                        const [adminSnap, studentSnap, teacherSnap] = await Promise.all([
                            database.ref('adminProfiles/' + user.uid).once('value'),
                            database.ref('studentProfilesV3/' + user.uid).once('value'),
                            database.ref('teacherProfiles/' + user.uid).once('value')
                        ]);
                        const explicitAdmin = adminSnap.val()?.isAdmin === true;
                        if(!explicitAdmin) {
                            await firebase.auth().signOut();
                            alert('هذا الحساب ليس له صلاحية إدارة المنصة. يجب إضافته كمدير من إعدادات Firebase.');
                            return;
                        }
                        document.getElementById('login-view').classList.add('hidden');
                        document.getElementById('panel-view').classList.remove('hidden');
                        admin.fixCustomSubjectsStructure();
                        admin.fetchData();
                        setTimeout(() => {
                            ['l','q','sim'].forEach(p => admin.updateHierarchy(p));
                            admin.updateVisHierarchy();
                        }, 800);
                    } catch(e) {
                        console.error('Admin access check failed', e);
                        await firebase.auth().signOut();
                        alert('تعذر التحقق من صلاحية الإدارة.');
                    }
                });
            },
            `;
          html=html.slice(0,initStart)+secureInit+html.slice(toggleStart);
        }
        html=html.replace(
          ".catch(e => { document.getElementById('login-btn').innerText = \"تسجيل الدخول\"; alert(e.message); });",
          ".catch(e => { document.getElementById('login-btn').innerText = \"تسجيل الدخول\"; const msg=(e.code===\"auth/invalid-login-credentials\"||e.code===\"auth/wrong-password\"||e.code===\"auth/user-not-found\")?\"البريد الإلكتروني أو كلمة المرور غير صحيحة، أو حساب الإدارة غير موجود في Firebase Authentication.\":(e.message||\"تعذر تسجيل الدخول\"); app.notify(msg,\"error\"); });"
        );
        html=html.replace(
          '<button type="button" id="login-btn" onclick="app.login(event)"',
          '<button type="button" id="login-btn" onclick="app.login(event)"'
        );
        html=html.replace(
          '</div>\n        </div>\n    </div>\n\n    <!-- Main Panel -->',
          '<button type="button" id="admin-reset-pass-btn" class="w-full mt-3 text-sm font-black text-blue-600 hover:text-blue-800" onclick="(async()=>{const email=document.getElementById(\'adm-email\').value.trim();if(!email){app.notify(\'اكتب البريد الإلكتروني أولًا\',\'error\');return}try{await firebase.auth().sendPasswordResetEmail(email);app.notify(\'تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك\')}catch(e){app.notify(\'تعذر إرسال الرابط. تأكد أن البريد مسجل في Firebase Authentication\',\'error\')}})()">نسيت كلمة المرور؟</button></div>\n        </div>\n    </div>\n\n    <!-- Main Panel -->'
        );
        html=html.replace('</head>','<link rel="stylesheet" href="assets/css/admin-modern.css?v=3"></head>');
        html=html.replace('</body>','<script src="assets/js/admin-ui.js?v=3"><\/script></body>');
        document.open();document.write(html);document.close();
      }catch(error){console.error(error);document.body.innerHTML='<div class="error"><h2>تعذر تشغيل لوحة الإدارة</h2><p>جرّب تحديث الصفحة بعد لحظات.</p></div>'}
    })();
  </script>
</body>
</html>
