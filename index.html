<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>جاري تحميل الأكاديمية...</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a;display:flex;min-height:100vh;align-items:center;justify-content:center}.loader{text-align:center;padding:32px}.spinner{width:46px;height:46px;border:5px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}h2{margin:0 0 8px;font-size:20px}p{margin:0;color:#64748b;font-size:14px}.error{max-width:620px;background:#fff;border:1px solid #fecaca;border-radius:20px;padding:24px;box-shadow:0 14px 35px rgba(15,23,42,.08)}
  </style>
</head>
<body>
  <div class="loader" id="loader"><div class="spinner"></div><h2>جاري تحميل النسخة الكاملة...</h2><p>يتم تشغيل جميع خصائص منصة الطالب الأصلية.</p></div>
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <script>
    (async function(){
      try{
        const parts=['legacy/student16.1.part','legacy/student16.2.part','legacy/student16.3.part'];
        const values=await Promise.all(parts.map(async path=>{
          const response=await fetch(path+'?v=1',{cache:'no-store'});
          if(!response.ok) throw new Error('تعذر تحميل '+path);
          return (await response.text()).trim();
        }));
        const b64=values.join('');
        const binary=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
        const html=pako.ungzip(binary,{to:'string'});
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        console.error(error);
        document.body.innerHTML='<div class="error"><h2>تعذر تشغيل النسخة الكاملة</h2><p>جرّب تحديث الصفحة بعد لحظات. إذا استمرت المشكلة سيتم إصلاح ملف التحميل.</p></div>';
      }
    })();
  </script>
</body>
</html>
