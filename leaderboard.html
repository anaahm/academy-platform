<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>الترتيب العام | الأكاديمية</title>
  <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/app-icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="./assets/styles.css"><link rel="stylesheet" href="./assets/learning.css"><link rel="stylesheet" href="./assets/hub.css">
</head>
<body class="feature-page">
  <div id="toast" class="toast"></div>
  <header class="learning-header">
    <div class="container learning-nav">
      <a class="brand" href="./index.html"><span class="brand-mark"><i class="fa-solid fa-book-open"></i></span><span><strong>الأكاديمية</strong><small>الترتيب العام</small></span></a>
      <div class="learning-breadcrumb"><a href="./index.html">الرئيسية</a><i class="fa-solid fa-chevron-left"></i><span>الترتيب</span></div>
      <span class="avatar" id="pageAvatar">ط</span>
    </div>
  </header>

  <main>
    <section class="feature-hero">
      <div class="container">
        <div class="feature-hero-card">
          <div class="feature-hero-copy"><span class="section-kicker light">تحدي نفسك مش زملاءك بس</span><h1>لوحة الترتيب</h1><p>اكسب XP بالتعلم والاختبارات، وشوف تقدمك بين طلاب الأكاديمية.</p></div>
          <span class="feature-hero-art">🏆</span>
        </div>
      </div>
    </section>

    <section class="container feature-container leaderboard-shell">
      <div class="feature-toolbar">
        <div class="feature-tabs">
          <button class="active" data-period="daily">اليوم</button>
          <button data-period="weekly">الأسبوع</button>
          <button data-period="monthly">الشهر</button>
          <button data-period="allTime">كل الوقت</button>
        </div>
        <div class="feature-filter"><select id="leaderLimit"><option value="20">أفضل 20</option><option value="50">أفضل 50</option><option value="100">أفضل 100</option></select></div>
      </div>

      <section class="feature-stat-row">
        <article><span class="stat-icon violet"><i class="fa-solid fa-ranking-star"></i></span><div><strong id="myRank">—</strong><small>ترتيبك الحالي</small></div></article>
        <article><span class="stat-icon blue"><i class="fa-solid fa-star"></i></span><div><strong id="myXp">0</strong><small>XP في الفترة</small></div></article>
        <article><span class="stat-icon green"><i class="fa-solid fa-file-circle-check"></i></span><div><strong id="myQuizCount">0</strong><small>اختبارات الفترة</small></div></article>
        <article><span class="stat-icon orange"><i class="fa-solid fa-medal"></i></span><div><strong id="myLevel">1</strong><small>مستواك</small></div></article>
      </section>

      <div class="podium" id="podium"></div>
      <div class="rank-list" id="rankList"></div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="./assets/firebase-config.js"></script><script src="./assets/student-core.js"></script><script src="./assets/leaderboard.js"></script><script src="./assets/activity-tracker.js"></script>
  <script src="./assets/pwa.js"></script>
</body>
</html>
