<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>المكتبة | الأكاديمية</title>
  <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/app-icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="./assets/styles.css"><link rel="stylesheet" href="./assets/learning.css"><link rel="stylesheet" href="./assets/hub.css">
  <link rel="stylesheet" href="./assets/ui-kit.css">
  <link rel="stylesheet" href="./assets/experience.css?v=30">
  <script src="./assets/academy-utils.js"></script>
</head>
<body class="feature-page">
  <div id="toast" class="toast"></div>
  <header class="learning-header">
    <div class="container learning-nav">
      <a class="brand" href="./index.html"><span class="brand-mark"><i class="fa-solid fa-book-open"></i></span><span><strong>الأكاديمية</strong><small>المكتبة</small></span></a>
      <div class="learning-breadcrumb"><a href="./index.html">الرئيسية</a><i class="fa-solid fa-chevron-left"></i><span>المكتبة</span></div>
      <span class="avatar" id="pageAvatar">ط</span>
    </div>
  </header>

  <main>
    <section class="feature-hero">
      <div class="container"><div class="feature-hero-card"><div class="feature-hero-copy"><span class="section-kicker light">كل ملفاتك في مكان واحد</span><h1>المكتبة التعليمية</h1><p>مذكرات، مراجعات، ملفات PDF ومراجع مساعدة منظمة حسب المادة والمرحلة.</p></div><span class="feature-hero-art">📚</span></div></div>
    </section>

    <section class="container feature-container">
      <div class="feature-toolbar">
        <div class="feature-tabs" role="tablist" aria-label="نطاق المكتبة">
          <button class="active" data-library-scope="mine" role="tab" aria-selected="true">مرحلتي</button>
          <button data-library-scope="all" role="tab" aria-selected="false">كل المراحل</button>
        </div>
        <div class="feature-filter">
          <select id="librarySubjectFilter" aria-label="تصفية المكتبة حسب المادة"><option value="">كل المواد</option></select>
          <input id="librarySearch" type="search" aria-label="البحث في المكتبة" placeholder="ابحث باسم الملف...">
        </div>
      </div>

      <div class="feature-stat-row">
        <article><span class="stat-icon red"><i class="fa-solid fa-file-pdf"></i></span><div><strong id="libraryTotal">0</strong><small>ملف متاح</small></div></article>
        <article><span class="stat-icon blue"><i class="fa-solid fa-book-open"></i></span><div><strong id="librarySubjects">0</strong><small>مادة بها ملفات</small></div></article>
        <article><span class="stat-icon green"><i class="fa-solid fa-graduation-cap"></i></span><div><strong id="libraryStage">—</strong><small>مرحلتك</small></div></article>
        <article><span class="stat-icon violet"><i class="fa-solid fa-folder-open"></i></span><div><strong id="libraryVisible">0</strong><small>نتائج ظاهرة</small></div></article>
      </div>

      <div class="library-grid" id="libraryGrid"></div>
    </section>
  </main>

  <script src="./assets/ui-kit.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="./assets/firebase-config.js"></script><script src="./assets/student-core.js"></script><script src="./assets/library.js"></script><script src="./assets/activity-tracker.js"></script>
  <script src="./assets/pwa.js"></script>
  <script src="./assets/student-shell.js"></script>
</body>
</html>
