<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>جدولي | الأكاديمية</title>
  <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/app-icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="./assets/styles.css"><link rel="stylesheet" href="./assets/learning.css"><link rel="stylesheet" href="./assets/hub.css">
  <link rel="stylesheet" href="./assets/ui-kit.css">
</head>
<body class="feature-page">
  <div id="toast" class="toast"></div>
  <header class="learning-header">
    <div class="container learning-nav">
      <a class="brand" href="./index.html"><span class="brand-mark"><i class="fa-solid fa-book-open"></i></span><span><strong>الأكاديمية</strong><small>جدولك الذكي</small></span></a>
      <div class="learning-breadcrumb"><a href="./index.html">الرئيسية</a><i class="fa-solid fa-chevron-left"></i><span>الجدول والمواعيد</span></div>
      <div class="learning-user"><a class="icon-btn" href="./planner.html" title="خطة المذاكرة"><i class="fa-regular fa-calendar-check"></i></a><span class="avatar" id="pageAvatar">ط</span></div>
    </div>
  </header>

  <main>
    <section class="feature-hero">
      <div class="container">
        <div class="feature-hero-card">
          <div><span class="section-kicker light">كل مواعيدك في مكان واحد</span><h1>جدولي الذكي</h1><p>حصص الأكاديمية، البث المباشر، ومهام المذاكرة اليومية مرتبة في أسبوع واضح.</p></div>
          <span class="feature-hero-art">📅</span>
        </div>
      </div>
    </section>

    <section class="container feature-page-content">
      <section class="feature-stat-grid">
        <article><span class="feature-card-icon blue"><i class="fa-solid fa-calendar-day"></i></span><div><strong id="scheduleTodayCount">0</strong><small>موعد اليوم</small></div></article>
        <article><span class="feature-card-icon violet"><i class="fa-solid fa-calendar-week"></i></span><div><strong id="scheduleWeekCount">0</strong><small>هذا الأسبوع</small></div></article>
        <article><span class="feature-card-icon green"><i class="fa-solid fa-tower-broadcast"></i></span><div><strong id="scheduleLiveCount">0</strong><small>جلسات مباشرة</small></div></article>
        <article><span class="feature-card-icon amber"><i class="fa-solid fa-list-check"></i></span><div><strong id="scheduleTaskCount">0</strong><small>مهام مذاكرة</small></div></article>
      </section>

      <section class="schedule-layout">
        <article class="feature-card schedule-calendar-card">
          <div class="feature-card-head"><div><span class="section-kicker">الأسبوع الحالي</span><h2 id="scheduleWeekLabel">جدول الأسبوع</h2></div><a class="btn btn-soft" href="./planner.html"><i class="fa-solid fa-plus"></i> أضف مهمة مذاكرة</a></div>
          <div id="scheduleWeek" class="schedule-week"></div>
        </article>

        <aside class="schedule-side">
          <article class="feature-card">
            <div class="feature-card-head"><div><span class="section-kicker">القادم</span><h3>أقرب موعد</h3></div><span>⏳</span></div>
            <div id="nextScheduleItem" class="next-schedule-item"></div>
          </article>
          <article class="feature-card">
            <div class="feature-card-head"><div><span class="section-kicker">فلترة</span><h3>اعرض</h3></div><span>🎛️</span></div>
            <div class="schedule-filters">
              <button class="active" data-schedule-filter="all">الكل</button>
              <button data-schedule-filter="class">الحصص</button>
              <button data-schedule-filter="live">البث</button>
              <button data-schedule-filter="task">المذاكرة</button>
            </div>
          </article>
        </aside>
      </section>
    </section>
  </main>

  <script src="./assets/ui-kit.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="./assets/firebase-config.js"></script>
  <script src="./assets/student-core.js"></script>
  <script src="./assets/schedule.js"></script>
  <script src="./assets/pwa.js"></script>
</body>
</html>
